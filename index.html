<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yeshaya</title>
  <meta name="description" content="Yeshaya — « L'Éternel est salut ». Prière, Bible, enseignements. 100 % gratuit, sans compte, hors ligne.">
  <meta name="theme-color" content="#172B49">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    /* Page provisoire de la phase 0 : la coquille complète arrive en phase 1. */
    :root { --bleu-nuit:#172B49; --or:#C9A85B; --ivoire:#F6F1E6; --sauge:#347C75; --gris:#454B55; }
    html,body { margin:0; height:100%; background:var(--ivoire); color:var(--gris);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:12px; padding:24px 16px; box-sizing:border-box; text-align:center; }
    img { width:128px; height:128px; }
    h1 { margin:8px 0 0; color:var(--bleu-nuit); font-size:28px; letter-spacing:.06em; }
    p { margin:0; }
    .slogan { color:var(--or); font-weight:600; }
    .bandeau { margin-top:16px; font-size:14px; max-width:320px; line-height:1.5; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-512.png" alt="Logo Yeshaya">
    <h1>YESHAYA</h1>
    <p class="slogan">« L'Éternel est salut »</p>
    <p class="bandeau">100 % gratuit · Aucune publicité · Aucun compte · Vos données restent sur votre téléphone · Fonctionne sans internet</p>
    <p class="bandeau"><small>Application en construction.</small></p>
  </main>
</body>
</html>
