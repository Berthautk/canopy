/* runtime behaviours of the showcase (slideshow, rotating words, counters, reveal, lightbox) */
let PUB = {timers:[], io:null};
function stopPublic() { PUB.timers.forEach(clearInterval); PUB.timers = []; if (PUB.io) PUB.io.disconnect(); PUB.io = null; window.removeEventListener("scroll", pubScroll); }
function pubScroll() { const h = $("#pubTop"); if (h) h.classList.toggle("solid", window.scrollY > 40); }
function initPublic() {
  stopPublic();
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.addEventListener("scroll", pubScroll, {passive:true}); pubScroll();
  const imgs = $$(".h6-slides img"), dots = $$(".h6-dots button");
  let cur = 0;
  const show = i => { cur = (i + imgs.length) % imgs.length; imgs.forEach((im, k) => im.classList.toggle("on", k === cur)); dots.forEach((d, k) => d.classList.toggle("on", k === cur)); };
  PUB.show = show;
  if (imgs.length > 1 && !reduce) PUB.timers.push(setInterval(() => show(cur + 1), 5000));
  const words = siteDefaults().rotate.filter(Boolean), rot = $("#rot");
  let w = 0;
  if (rot && words.length > 1 && !reduce) PUB.timers.push(setInterval(() => { w = (w + 1) % words.length; rot.classList.remove("in"); void rot.offsetWidth; rot.textContent = words[w]; rot.classList.add("in"); }, 2600));
  const count = el => { const to = +el.dataset.count, suf = el.dataset.suffix || "", t0 = performance.now(), dur = 1200; const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e).toLocaleString("fr-FR") + suf; if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); };
  if ("IntersectionObserver" in window && !reduce) {
    const vh = window.innerHeight;
    $$(".v6 .rv").forEach(el => { if (el.getBoundingClientRect().top > vh * .9) el.classList.add("pre"); });
    PUB.io = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting) return; const el = en.target; el.classList.add("in"); el.classList.remove("pre"); el.querySelectorAll?.("[data-count]").forEach(count); if (el.dataset.count) count(el); PUB.io.unobserve(el); }), {threshold:.15});
    $$(".v6 .rv").forEach(el => PUB.io.observe(el));
  }
}
function openLightbox(postId, i) {
  const p = DB.site.posts.find(x => x.id === postId); if (!p) return;
  let k = i;
  const box = document.createElement("div"); box.className = "lb"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", p.title);
  const draw = () => { box.innerHTML = `<button class="lb-x" aria-label="Fermer">×</button>${p.photos.length > 1 ? `<button class="lb-p" aria-label="Photo précédente">‹</button><button class="lb-n" aria-label="Photo suivante">›</button>` : ""}<figure><img src="${p.photos[k]}" alt=""><figcaption>${esc(p.title)} · ${k + 1} / ${p.photos.length}</figcaption></figure>`; };
  draw(); document.body.appendChild(box);
  let sx = null;
  const closeLb = () => { box.remove(); document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape") closeLb(); if (e.key === "ArrowRight") { k = (k + 1) % p.photos.length; draw(); } if (e.key === "ArrowLeft") { k = (k - 1 + p.photos.length) % p.photos.length; draw(); } };
  document.addEventListener("keydown", key);
  box.addEventListener("click", e => { if (e.target.closest(".lb-n")) { k = (k + 1) % p.photos.length; draw(); } else if (e.target.closest(".lb-p")) { k = (k - 1 + p.photos.length) % p.photos.length; draw(); } else if (e.target.closest(".lb-x") || e.target === box) closeLb(); });
  box.addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
  box.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) { k = (k + (dx < 0 ? 1 : -1) + p.photos.length) % p.photos.length; draw(); } sx = null; });
}

/* Dictée : l'utilisatrice démarre et arrête elle-même ; les silences ne coupent plus l'écoute */
let REC = null, REC_ON = false, REC_T = null, REC_LAST = "";
const SRclass = () => window.SpeechRecognition || window.webkitSpeechRecognition;
function dictate(target, btn) {
  if (REC_ON) { const same = REC_T === target; stopDictation(); if (same) return; }
  if (!SRclass()) { toast("Dictée indisponible sur ce navigateur : touchez le micro 🎤 du clavier de votre téléphone"); $("#" + target)?.focus(); return; }
  REC_ON = true; REC_T = target; REC_LAST = "";
  $$(".mic").forEach(b => { if (b.dataset.t === target) { b.classList.add("rec"); b.textContent = "⏹ Arrêter la dictée"; } });
  recBar(true, "");
  startRec();
}
function startRec() {
  let r;
  try { r = new (SRclass())(); } catch(e) { stopDictation(); toast("Dictée indisponible : utilisez le micro du clavier"); return; }
  r.lang = $("#rc_lang")?.value === "en" ? "en-GB" : "fr-FR";
  r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i], txt = res[0].transcript.trim();
      if (res.isFinal) { if (txt && txt !== REC_LAST) { REC_LAST = txt; appendDict(txt); } }
      else interim += " " + txt;
    }
    recBar(true, interim.trim());
  };
  r.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed" || ev.error === "audio-capture") { stopDictation(); toast("Micro refusé : autorisez-le dans le navigateur, ou utilisez le micro du clavier"); }
  };
  r.onend = () => { REC = null; if (REC_ON) setTimeout(() => { if (REC_ON && !REC) startRec(); }, 120); };
  try { r.start(); REC = r; } catch(e) { setTimeout(() => { if (REC_ON && !REC) startRec(); }, 300); }
}
function stopDictation() {
  REC_ON = false;
  const r = REC; REC = null;
  try { r && r.stop(); } catch(e) {}
  $$(".mic.rec").forEach(b => { b.classList.remove("rec"); b.textContent = "🎤 Dicter"; });
  recBar(false);
}
function appendDict(txt) {
  const el = $("#" + REC_T); if (!el) { stopDictation(); return; }
  const bullet = REC_T === "rc_points";
  const cmdNew = /^(à la ligne|a la ligne|point suivant|nouvelle ligne|new line)[\s.,]*/i;
  let v = el.value.replace(/\s+$/, "");
  let t = txt;
  while (cmdNew.test(t)) { t = t.replace(cmdNew, ""); v += "\n" + (bullet ? "• " : ""); }
  t = t.replace(/\s*(à la ligne|point suivant|nouvelle ligne)\s*$/i, m => { v += ""; return "\n" + (bullet ? "• " : ""); });
  if (!t.trim()) { el.value = v; if (REC_T.startsWith("rc_")) updRecap(); return; }
  const endsSentence = !v.trim() || /[.!?:]\s*$|\n(• )?$/.test(v);
  if (!v.trim()) v = bullet ? "• " : "";
  const piece = endsSentence ? t.charAt(0).toUpperCase() + t.slice(1) : t;
  el.value = v + (/(\n|• )$/.test(v) || !v ? "" : " ") + piece;
  el.scrollTop = el.scrollHeight;
  if (REC_T.startsWith("rc_")) updRecap();
}
function recBar(on, interim) {
  let b = $("#recbar");
  if (!on) { b && b.remove(); return; }
  if (!b) { b = document.createElement("div"); b.id = "recbar"; b.innerHTML = `<span class="rb-dot"></span><div><b>Je vous écoute…</b><small>Parlez librement, les pauses ne coupent pas. Dites « à la ligne » pour un nouveau point.</small><em id="rb-int"></em></div><button type="button" data-a="stopDict">⏹ Arrêter</button>`; document.body.appendChild(b); }

}

      toast("⏰ Rappel : " + t.title);
      try {
        if ("Notification" in window && Notification.permission === "granted") {
          const opts = {body:t.title + (t.note ? " — " + t.note : ""), icon:"icon-192.png", tag:t.id};
          if (navigator.serviceWorker?.controller) navigator.serviceWorker.ready.then(r => r.showNotification("VLA · Rappel " + t.time, opts)); else new Notification("VLA · Rappel " + t.time, opts);
        }
      } catch(e) {}
    });
  };
  tick(); REMIND = setInterval(tick, 30000);
}

/* ============ live calcs in forms ============ */
function updLearnerCalc() {
  const el = $("#lf_calc"); if (!el) return;
  const p = prog($("#lf_prog").value); if (!p) return;
  const n = Math.max(1, +$("#lf_size").value || 1), disc = +$("#lf_disc").value || 0, t = price(p, n);
  el.innerHTML = `Tarif : <b>${money(t)}</b> par personne ${p.months > 1 ? "pour " + p.months + " mois" : "par mois"}${n > 1 ? ` (groupe de ${n})` : ""}${disc ? ` − remise ${money(disc)} = <b>${money(Math.max(0, t - disc))}</b>` : ""} · test ${money(p.testFee)}${p.regFee ? " · inscription " + money(p.regFee) : ""}`;
}
function updPayCalc() {
  const el = $("#pf_calc"); if (!el || !learner($("#pf_l")?.value)) return;
  const l = learner($("#pf_l").value), p = prog(l.programId), a = account(l), o = $("#pf_o").value;
  let sug = 0, msg = "";
  if (o === "Frais de test") { sug = p.testFee; msg = `Frais de test ${esc(p.name)} : <b>${money(p.testFee)}</b>${a.testPaid ? " — déjà payés" : ""}`; }
  else if (o === "Frais d'inscription") { sug = p.regFee; msg = `Frais d'inscription : <b>${money(p.regFee)}</b>`; }
  else if (o === "Formation") {
    if (l.stage === "formation" && a.daysLeft < 0) { sug = a.due; msg = `Période expirée : ce paiement ouvre une nouvelle période de <b>${money(a.due)}</b>`; }
    else if (["inscrit","formation"].includes(l.stage)) { sug = a.balance; msg = `Tarif ${money(a.due)} · déjà payé ${money(a.paid)} · <b>reste ${money(a.balance)}</b>`; }
    else { sug = a.due; msg = `Tarif ${money(a.due)}. L'apprenant passera à l'étape « Inscrit ».`; }
  } else msg = "Livre, cahier ou support : montant libre.";
  el.innerHTML = msg;
  const inp = $("#pf_a"); if (!inp.dataset.touched) inp.value = sug || "";
}

/* ============ actions ============ */
function toast(t) { $$(".toast").forEach(x => x.remove()); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
function openModal(m) {
  if (REC_ON) stopDictation();
  S.modal = m; render();
  if (m.type === "learner") updLearnerCalc();
  if (m.type === "payment") updPayCalc();
  if (m.type === "outflow") updOutTot();
  if (m.type === "recap") updRecap();
  if (m.type === "logCourse") updLogHint();
  const f = document.querySelector(".modal input:not([type=checkbox]):not([disabled]), .modal textarea");
  if (f && !["receipt","cert","confirm"].includes(m.type)) f.focus();
}
function doLogout() {
  const n = S.user ? S.user.name.split(" ")[0] : "";
  try { localStorage.removeItem(KEY + "-keep"); sessionStorage.setItem(KEY + "-u", "out"); } catch(e) {}
  S.user = null; S.public = true; S.pubPreview = false; S.hist = []; S.modal = null; render(); window.scrollTo(0, 0);
  toast(`Vous êtes déconnecté·e${n ? ", " + n : ""}. À bientôt !`);
}
function close() { if (REC_ON) stopDictation(); S.modal = null; render(); }
function go(v) { if (S.view !== v || v === "learner") { S.hist.push({view:S.view, learnerId:S.learnerId}); if (S.hist.length > 30) S.hist.shift(); } S.view = v; S.modal = null; render(); window.scrollTo(0, 0); }
function back() { const h = S.hist.pop(); if (!h) return; S.view = h.view; S.learnerId = h.learnerId; S.modal = null; render(); window.scrollTo(0, 0); }
function ask(title, text, ok, run, danger = true) { openModal({type:"confirm", title, text, ok, run, danger}); }
function commit(msg, logText, k) { if (logText) logAct(logText, k); save(); if (msg) toast(msg); }
function advance(l) {
  const i = STAGES.findIndex(s => s.k === l.stage);
  if (i >= 4) return;
  const nx = STAGES[i + 1].k;
  if (nx === "test" && !l.testDate) l.testDate = addDays(TODAY, 1);
  if (nx === "formation" && !l.periodStart) l.periodStart = TODAY;
  l.stage = nx;
  l.history.push({d:TODAY, t:"Passé à l'étape « " + stageL(nx) + " »"});
  commit(l.name.split(" ")[0] + " → " + stageL(nx), `${l.name} passé·e à « ${stageL(nx)} »`);
  if (nx === "test") openModal({type:"wa", id:l.id, k:"test"});
  else if (nx === "inscrit") openModal({type:"wa", id:l.id, k:"bienvenue"});
  else render();
}

      const d = {name:val("#mb_n"), role:$("#mb_r").value, phone:val("#mb_p"), rate:+$("#mb_rate").value || 0, photo:S.modal.photo};
      let ps = val("#mb_ps").toLowerCase().replace(/[^a-z0-9._-]/g, ""), code = val("#mb_code");
      if (!ps) { ps = d.name.split(" ")[0].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "") || "membre"; while (DB.team.some(t => t.pseudo === ps && t.id !== S.modal.id)) ps += Math.floor(Math.random() * 10); }
      if (DB.team.some(t => t.pseudo === ps && t.id !== S.modal.id)) { toast("Ce pseudo est déjà utilisé par quelqu'un d'autre"); return; }
      if (!code) code = String(1000 + Math.floor(Math.random() * 9000));
      if (S.modal.id) { const mm = member(S.modal.id), changed = mm.code !== code || mm.pseudo !== ps; Object.assign(mm, d, {pseudo:ps, code}); commit(changed ? "Accès modifié : l'ancien code ne fonctionne plus" : "Membre modifié", `Membre modifié : ${d.name}${changed ? " (nouvel accès)" : ""}`); return close(); }
      DB.team.push({id:uid(), ...d, pseudo:ps, code, active:true}); commit(`Accès créé : ${ps} / ${code}`, `Recrutement : ${d.name} (${ROLE_L[d.role]})`); return close();
    }
    case "delMember": {
      const m = member(id), used = DB.groups.filter(g => g.teacherId === id).length;
      if (used) { toast(`${m.name.split(" ")[0]} anime encore ${used} groupe(s) : changez d'abord le formateur`); return; }
      return ask("Supprimer ce membre ?", `${esc(m.name)} ne pourra plus se connecter. Ses cours déjà déclarés restent dans l'historique.`, "Supprimer", () => { m.active = false; m.deleted = true; DB.team = DB.team.filter(t => t.id !== id || DB.reports && Object.values(DB.reports).some(r => r.by === id)); if (DB.team.includes(m)) m.role = m.role; commit("Membre supprimé", `Membre supprimé : ${m.name}`); close(); });
    }
    case "newCode": { const m = member(id); m.code = String(1000 + Math.floor(Math.random() * 9000)); commit("Nouveau code pour " + m.name.split(" ")[0] + " : " + m.code, `Nouveau code d'accès pour ${m.name}`); return render(); }
    case "toggleMember": { const m = member(id); m.active = !m.active; commit(m.active ? "Accès réactivé" : "Accès bloqué", `${m.active ? "Accès réactivé" : "Accès bloqué"} : ${m.name}`); return S.modal ? openModal(S.modal) : render(); }
    case "payTeacher": {
      const t2 = member(id), m = t.dataset.m, x = teacherMonth(t2, m);
      return ask("Enregistrer la paie ?", `${esc(t2.name)} — ${fm(m)} : ${fh(x.h)} × ${money(t2.rate)} = <b>${money(x.amount)}</b>. Une dépense « Salaires formateurs » sera créée.`, "Marquer payé", () => {
        const e = {id:uid(), date:TODAY, time:nowHM(), cat:"Salaires formateurs", label:`${t2.name} — ${fm(m)} (${fh(x.h)})`, amount:x.amount, method:"MTN MoMo", by:S.user.id, kind:"depense", ref:`BS-${TODAY.slice(0, 4)}-${String(DB.settings.nextOut++).padStart(4, "0")}`};
        DB.expenses.push(e); DB.teacherPaid[t2.id + "|" + m] = e.id; commit("Paie enregistrée", `Paie ${t2.name} ${fm(m)} : ${money(x.amount)}`, "cash"); close();
      }, false);
    }
    case "saveGroup": {
      if (!$("#grForm").reportValidity()) return;
      const days = $$(".gr_d:checked").map(x => +x.value); if (!days.length) { toast("Choisissez au moins un jour"); return; }
      const d = {name:val("#gr_n"), programId:$("#gr_p").value, teacherId:$("#gr_t").value, days, start:$("#gr_s").value, end:$("#gr_e").value, room:val("#gr_r"), capacity:Math.max(1, +$("#gr_c").value || 1)};
      if (S.modal.id) Object.assign(group(S.modal.id), d); else DB.groups.push({id:uid(), since:TODAY, ...d});
      commit(S.modal.id ? "Groupe modifié" : "Groupe créé", `${S.modal.id ? "Groupe modifié" : "Nouveau groupe"} : ${d.name}`); return close();
    }
    case "delGroup": {
      const g = group(id), n = groupMembers(g).length;
      if (n) { toast(`Ce groupe a encore ${n} apprenant(s) : déplacez-les d'abord`); return; }
      return ask("Supprimer le groupe ?", `${esc(g.name)} disparaîtra de l'agenda. Les cours déjà déclarés restent comptés dans les heures.`, "Supprimer", () => { DB.groups = DB.groups.filter(x => x.id !== id); commit("Groupe supprimé", `Groupe supprimé : ${g.name}`); close(); });
    }
    case "saveExpense": {
      if (!$("#exForm2").reportValidity()) return;
      const e = DB.expenses.find(x => x.id === S.modal.id), old = money(e.amount);
      Object.assign(e, {cat:$("#xp_c").value, date:$("#xp_d").value || e.date, label:val("#xp_l"), amount:+$("#xp_a").value || 0, method:$("#xp_m").value});
      if (e.kind !== "apport") e.kind = e.cat === "Retrait de la directrice" ? "retrait" : "depense";
      commit("Mouvement corrigé", `Mouvement corrigé : ${e.label} (${old} → ${money(e.amount)})`, "cash"); return close();
    }
    case "delExpense": { const x = DB.expenses.find(e => e.id === id); return ask("Supprimer ce mouvement ?", `${esc(x.label)} · ${money(x.amount)}`, "Supprimer", () => { DB.expenses = DB.expenses.filter(e => e.id !== id); Object.keys(DB.teacherPaid).forEach(k => { if (DB.teacherPaid[k] === id) delete DB.teacherPaid[k]; }); commit("Mouvement supprimé", `Mouvement supprimé : ${x.label} (${money(x.amount)})`, "cash"); close(); }); }
    case "saveScore": {
      if (!$("#scForm").reportValidity()) return;
      const l = learner(S.modal.id), d = {label:$("#sc_l").value, date:$("#sc_d").value || TODAY, score:+$("#sc_s").value, max:+$("#sc_m").value || 60};
      if (S.modal.sid) Object.assign(l.scores.find(x => x.id === S.modal.sid), d); else { l.scores.push({id:uid(), by:S.user.id, ...d}); l.history.push({d:d.date, t:`${d.label} : ${d.score}/${d.max}`}); }
      commit("Note enregistrée", `Note ${d.label} ${d.score}/${d.max} pour ${l.name}`); return close();
    }
    case "delScore": { const l = learner(S.modal.id); l.scores = l.scores.filter(x => x.id !== S.modal.sid); commit("Note supprimée", `Note supprimée pour ${l.name}`); return close(); }
    case "addTier": { const p = prog(t.dataset.p); const last = p.tiers[p.tiers.length - 1]; if (last && last.max >= 99) last.max = last.min; p.tiers.push({min:(last ? last.max + 1 : 1), max:99, price:last ? last.price : 0}); commit("", `Palier ajouté à ${p.name}`); return render(); }
    case "delTier": { const p = prog(t.dataset.p); if (p.tiers.length > 1) p.tiers.splice(+t.dataset.i, 1); commit("", `Palier supprimé de ${p.name}`); return render(); }
    case "newProgram": DB.programs.push({id:uid(), name:"Nouveau programme", public:"Public", months:1, testFee:0, regFee:0, tiers:[{min:1, max:99, price:0}]}); commit("Programme ajouté", "Nouveau programme"); return render();
    case "delProgram": {
      const p = prog(id), n = DB.learners.filter(l => l.programId === id).length + DB.groups.filter(g => g.programId === id).length;
      if (n) { toast("Ce programme est utilisé par des apprenants ou des groupes"); return; }
      return ask("Supprimer le programme ?", esc(p.name), "Supprimer", () => { DB.programs = DB.programs.filter(x => x.id !== id); commit("Programme supprimé", `Programme supprimé : ${p.name}`); close(); });
    }
    case "reset": return ask("Réinitialiser la démo ?", "Toutes les données saisies pendant l'essai seront remplacées par les exemples de départ.", "Réinitialiser", () => { DB = seed(); fixSeed(); save(); S.modal = null; toast("Démo réinitialisée"); go("today"); });
    case "confirmOk": return S.modal.run ? S.modal.run() : close();
  }
});
function copyText(txt, ok) {
  const fb = () => { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(ok); } catch(e) { toast("Copie impossible sur cet appareil"); } ta.remove(); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(() => toast(ok), fb); else fb();
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q" || t.id === "payQ") { S[t.id] = t.value; const pos = t.selectionStart; render(); const q = $("#" + t.id); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (t.closest("#rcForm")) return updRecap();
  if (t.classList.contains("ol_a")) return updOutTot();
  if (t.dataset.site && t.type !== "checkbox") { DB.site[t.dataset.site] = ["benefits","ticker","rotate"].includes(t.dataset.site) ? t.value.split("\n") : t.value; save(); return; }
  if (["lf_prog","lf_size","lf_disc"].includes(t.id)) return updLearnerCalc();
  if (t.id === "pf_a") { t.dataset.touched = "1"; return; }
  if (["pf_l","pf_o"].includes(t.id)) { if (!S.modal?.pid) $("#pf_a").dataset.touched = ""; return updPayCalc(); }
  if (t.id === "waText") { const g = $("#waGo"); g.href = waLink(g.dataset.phone, t.value); return; }
  if (t.dataset.open) { const o = DB.settings.opening = DB.settings.opening || {date:TODAY, by:{}}; o.by = o.by || {}; if (t.dataset.open === "date") o.date = t.value || TODAY; else o.by[t.dataset.open] = Math.max(0, +t.value || 0); save(); return; }
  if (t.dataset.set) { DB.settings[t.dataset.set] = t.type === "number" ? Math.max(1, +t.value || 1) : t.value; save(); return; }
  if (t.dataset.tpl) { DB.settings.tpl[t.dataset.tpl][t.dataset.lg] = t.value; save(); return; }
  const pc = t.closest("[data-prog]");
  if (pc) {
    const p = prog(pc.dataset.prog);
    if (t.dataset.pf) p[t.dataset.pf] = t.type === "number" ? (+t.value || 0) : t.value;
    if (t.dataset.tier) p.tiers[+t.dataset.tier][t.dataset.tf] = +t.value || 0;
    save();
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.site && t.type === "checkbox") { DB.site[t.dataset.site] = t.checked; commit("Vitrine mise à jour", "Vitrine : affichage des tarifs " + (t.checked ? "activé" : "masqué")); return; }
  if (t.dataset.upload) {
    const files = [...t.files]; if (!files.length || !S.modal) return;
    try {
      if (t.dataset.upload === "photo") { S.modal.photo = await resizeImg(files[0], S.modal.type === "director" ? 700 : 320); $("#ph_prev").innerHTML = `<img class="av ph" src="${S.modal.photo}" style="width:84px;height:84px" alt="">`; }
      else { for (const f of files.slice(0, 6 - S.modal.photos.length)) S.modal.photos.push(await resizeImg(f, 1100)); $("#ph_list").innerHTML = S.modal.photos.map((ph, i) => phThumb(ph, i)).join(""); }
    } catch(err) { toast("Cette image n'a pas pu être lue"); }
    t.value = ""; return;
  }
  if (t.id === "lg_g") { const g = group(t.value); $("#lg_p").innerHTML = logPresentHTML(t.value); $("#lg_s").value = g.start; $("#lg_e").value = g.end; $("#lg_l").value = prog(g.programId)?.name || ""; updLogHint(); return; }
  if (t.id === "lg_d") { updLogHint(); return; }
  if (t.id === "grpFilter") { S.group = t.value; return render(); }
  if (t.id === "payMonth") { S.payMonth = t.value; return render(); }
  if (t.id === "cashDate") { S.cashDate = t.value || TODAY; return render(); }
  if (t.closest("[data-prog]")) { logAct(`Tarifs modifiés : ${prog(t.closest("[data-prog]").dataset.prog)?.name}`); save(); render(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "loginForm") {
    const p = $("#lg_p").value.trim().toLowerCase(), c = $("#lg_c").value.trim();
    const u = DB.team.find(t => t.pseudo === p && t.code === c);
    if (!u) { $("#lg_err").textContent = "Pseudo ou code incorrect. Demandez vos accès à la manager."; return; }
    if (!u.active) { $("#lg_err").textContent = "Cet accès a été bloqué par la manager."; return; }
    S.user = u; S.hist = []; S.public = false; try { sessionStorage.setItem(KEY + "-u", u.id); if ($("#lg_keep")?.checked) localStorage.setItem(KEY + "-keep", u.id); } catch(e) {} S.view = navFor(u)[0][0]; render(); window.scrollTo(0, 0);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.modal) close(); });
render();
</script>

<script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
