<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Valérie Language Academy, Garoua : cours d'anglais pour enfants, adolescents et adultes, préparation IELTS et TOEFL.">
<meta property="og:title" content="Valérie Language Academy — Garoua">
<meta property="og:description" content="L'anglais ouvre les portes, nous vous donnons les clés.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>VLA Gestion</title>
<meta name="theme-color" content="#1B2A4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#F6F7FA; --ink:#18202E; --muted:#5D6778; --line:#DFE3EB;
  --navy:#1B2A4A; --gold:#C9A84C; --gold-soft:#FBF4E1; --gold-ink:#7A5E14;
  --teal:#0C8C87; --teal-soft:#E3F5F4;
  --ok:#1E7F52; --ok-soft:#E4F4EB; --warn:#A8690F; --warn-soft:#FCF1DE; --bad:#B8362F; --bad-soft:#FBE7E5;
  --info:#2F5DA8; --info-soft:#E6EEFA;
  --pri-bg:#1B2A4A; --pri-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,55,.05),0 4px 14px rgba(20,30,55,.05);
  --r:12px;
  --display:"Figtree","Trebuchet MS",system-ui,sans-serif;
  --brand:"Cinzel","Times New Roman",Georgia,serif;
  --body:"Figtree","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1420; --surface:#161E2D; --surface2:#1B2536; --ink:#E8ECF3; --muted:#9BA5B6; --line:#2A3548;
  --navy:#0F182A; --gold:#D8B95E; --gold-soft:#2E2816; --gold-ink:#E8CD7C;
  --teal:#2BB8B1; --teal-soft:#123230;
  --ok:#4CC08A; --ok-soft:#14301F; --warn:#E3A845; --warn-soft:#33260F; --bad:#EE746B; --bad-soft:#3A1917;
  --info:#7FA6EA; --info-soft:#18263F; --pri-bg:#D8B95E; --pri-ink:#1B2A4A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1420; --surface:#161E2D; --surface2:#1B2536; --ink:#E8ECF3; --muted:#9BA5B6; --line:#2A3548;
  --navy:#0F182A; --gold:#D8B95E; --gold-soft:#2E2816; --gold-ink:#E8CD7C;
  --teal:#2BB8B1; --teal-soft:#123230;
  --ok:#4CC08A; --ok-soft:#14301F; --warn:#E3A845; --warn-soft:#33260F; --bad:#EE746B; --bad-soft:#3A1917;
  --info:#7FA6EA; --info-soft:#18263F; --pri-bg:#D8B95E; --pri-ink:#1B2A4A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:800}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.strike{text-decoration:line-through;opacity:.55}

/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 4px}
.logo{width:46px;height:46px;border-radius:50%;flex:none;background:#fff;box-shadow:0 0 0 2px rgba(201,168,76,.55)}
.brand b{font-family:var(--brand);font-size:15px;display:block;line-height:1.15;letter-spacing:.04em;color:#E6CF8C}
.brand span{font-size:11.5px;opacity:.72;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-weight:500;color:rgba(255,255,255,.78)}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(201,168,76,.16);color:#fff;box-shadow:inset 3px 0 0 #C9A84C}
.nav button:focus-visible{outline:2px solid #C9A84C}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:#C9A84C;color:#1B2A4A;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.who{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 6px 0;font-size:13px}
.who b{display:block;font-size:14px}
.who .role{opacity:.7}
.who button{all:unset;cursor:pointer;margin-top:8px;font-size:13px;color:#E6CF8C;text-decoration:underline}
.main{padding-block:22px 70px;padding-inline:28px;min-width:0;max-width:1320px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:27px}
.top p{margin:4px 0 0}
.mobilebar{display:none}
@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobilebar{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
  .mb-top{display:flex;align-items:center;gap:10px;padding:10px 16px}
  .mb-top .logo{width:34px;height:34px}
  .mb-top b{font-family:var(--brand);font-size:14px;color:#E6CF8C;letter-spacing:.04em}
  .mb-top button{all:unset;cursor:pointer;margin-left:auto;font-size:13px;color:#E6CF8C}
  .mb-tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
  .mb-tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 12px;border-radius:99px;font-size:14px;color:rgba(255,255,255,.82);background:rgba(255,255,255,.07)}
  .mb-tabs button.on{background:#C9A84C;color:#1B2A4A;font-weight:700}
  .main{padding-inline:16px;padding-block:16px 70px}
  .top h1{font-size:23px}
}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3{grid-template-columns:1fr}}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}}
.stat{padding:14px 16px}
.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat .val{font-size:25px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.stat .sub{font-size:13px;color:var(--muted)}
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.sect h2{font-size:18px}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri-bg);border-color:var(--pri-bg);color:var(--pri-ink)}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B2A4A}
.btn.danger{color:var(--bad)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn svg{width:16px;height:16px;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-prospect,.p-info{background:var(--info-soft);color:var(--info)}
.p-test,.p-gold{background:var(--gold-soft);color:var(--gold-ink)}
.p-inscrit{background:var(--teal-soft);color:var(--teal)}
.p-formation,.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-termine,.p-mute{background:var(--surface2);color:var(--muted)}
.p-abandon,.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.alert .stripe{align-self:stretch}
.alert .body{padding:12px 0}
.alert .body b{display:block}
.alert .act{padding:10px 14px 10px 0;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.s-bad{background:var(--bad)}.s-warn{background:var(--warn)}.s-info{background:var(--info)}.s-gold{background:var(--gold)}
@media (max-width:640px){.alert{grid-template-columns:6px 1fr}.alert .act{grid-column:2;justify-content:flex-start;padding:0 14px 12px 0}}

.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pipe button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pipe button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.pipe .n{font-size:22px;font-weight:800}
.pipe .l{font-size:12.5px;color:var(--muted);font-weight:600}
@media (max-width:900px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--surface2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--teal-soft);color:var(--teal);flex:none}
.li .t{font-weight:700}
.li .s{font-size:13px;color:var(--muted)}
.li .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.right{text-align:right}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:0}
.tools input[type=search]{flex:1 1 220px}

/* forms */
.f{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.f2,.f3{grid-template-columns:1fr}}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.fl input,label.fl select,label.fl textarea{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-weight:400;color:var(--ink);font-size:15px;width:100%}
label.fl textarea{min-height:90px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.calc{background:var(--gold-soft);color:var(--gold-ink);border-radius:9px;padding:10px 12px;font-size:14px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-weight:600;color:var(--ink);font-size:13px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.52);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:580px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:780px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.mh h3{font-size:18px}
.mb{padding:18px 20px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .left{margin-right:auto}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}

/* paper documents (receipt, certificate): fixed look in both themes */
.paper{background:#FFFDF8;color:#1B2230;border:1px solid #E6DDC4;border-radius:10px;position:relative;overflow:hidden}
.receipt{padding:22px;font-size:14px}
.receipt .rh{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:2px solid #1B2A4A;padding-bottom:12px}
.receipt .rh img{width:62px;height:62px;border-radius:50%}
.receipt h4{margin:0;font-family:var(--brand);font-size:16px;color:#1B2A4A;letter-spacing:.03em}
.receipt .no{font-weight:800;color:#1B2A4A;text-align:right;white-space:nowrap}
.receipt .ttl{text-align:center;font-family:var(--brand);letter-spacing:.16em;font-size:13px;color:#7A5E14;margin:14px 0}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.receipt dt{color:#5D6778;font-size:12.5px}
.receipt dt i{display:block;font-size:11px;opacity:.85}
.receipt dd{margin:0;font-weight:700}
.receipt .amt{margin:16px 0;background:#1B2A4A;color:#fff;border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.receipt .amt b{font-size:24px;color:#E6CF8C}
.receipt .foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#5D6778;border-top:1px dashed #D8CFB5;padding-top:10px;margin-top:12px;flex-wrap:wrap}
.receipt .foot i{font-family:Georgia,serif}
.stamp{position:absolute;right:22px;top:128px;transform:rotate(-12deg);border:2px solid #0C8C87;color:#0C8C87;font-weight:800;padding:4px 10px;border-radius:6px;opacity:.75;letter-spacing:.1em;font-size:13px}
.stamp.void{border-color:#B8362F;color:#B8362F;top:150px;font-size:18px}
.cert{padding:30px 26px;text-align:center;border:6px double #C9A84C;border-radius:6px}
.cert img{width:96px;height:96px;border-radius:50%}
.cert .ct{font-family:var(--brand);font-size:22px;letter-spacing:.12em;color:#1B2A4A;margin:10px 0 2px}
.cert .cs{font-size:12px;letter-spacing:.2em;color:#7A5E14;text-transform:uppercase}
.cert .nm{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:28px;color:#1B2A4A;margin:16px 0 6px;border-bottom:1px solid #D8CFB5;display:inline-block;padding:0 20px 4px}
.cert p{margin:6px auto;max-width:480px;color:#3A4354;font-size:14px}
.cert .sig{display:flex;justify-content:space-between;gap:20px;margin-top:28px;font-size:12px;color:#5D6778}
.cert .sig div{border-top:1px solid #9AA3B2;padding-top:6px;min-width:130px}
.msgbox{white-space:pre-wrap;background:#E7F7EC;color:#10301C;border-radius:10px 10px 10px 2px;padding:12px 14px;font-size:14px;border:1px solid #BFE6CB}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.timeline{display:flex;flex-direction:column;gap:9px;font-size:14px}
.timeline div{display:grid;grid-template-columns:96px 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.bar.gold i{background:var(--gold)}
.bar.bad i{background:var(--bad)}
.day{margin-top:18px}
.day h3{font-size:13px;margin-bottom:8px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.ev{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .h{font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:600px){.ev{grid-template-columns:76px 1fr}.ev>.row{grid-column:2}}
.tier{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px;align-items:end}
.tier input{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:13.5px;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.note{background:var(--gold-soft);color:var(--gold-ink);border-radius:10px;padding:10px 14px;font-size:13.5px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:150px;padding-top:10px}
.bars .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .pair i{width:38%;max-width:22px;border-radius:4px 4px 0 0;background:var(--teal);min-height:2px}
.bars .pair i.d{background:var(--gold)}
.bars .m{font-size:12px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--teal)}
.legend span.d::before{background:var(--gold)}

.login{min-height:100%;display:grid;place-items:center;padding-block:30px;padding-inline:16px;background:var(--navy)}
.lbox{width:100%;max-width:420px;background:var(--surface);border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:left}
.lbox .hero{text-align:center}
.lbox .hero img{width:128px;height:128px;border-radius:50%}
.lbox h1{font-size:22px;margin-top:10px}
.demo-acc{display:grid;gap:8px;margin-top:10px}
.demo-acc button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap}
.demo-acc button:hover{border-color:var(--gold)}
.menu{position:relative}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}

/* v4 additions */
.av.ph{object-fit:cover;background:var(--surface2);display:block}
.backbtn{display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;background:var(--surface);border:2px solid var(--gold);color:var(--ink);border-radius:12px;padding:10px 18px;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
.backbtn span{font-weight:500;font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.backbtn:hover{background:var(--gold-soft)}
button.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:block}
button.tile:hover{border-color:var(--gold)}
button.tile:focus-visible{outline:2px solid var(--gold)}
.staffrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
button.staff{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
button.staff:hover{border-color:var(--gold)}
.st{font-size:13px;font-weight:700;margin:6px 0 4px;display:flex;align-items:center;gap:6px}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.st-ok{color:var(--ok)}.st-live{color:var(--teal)}.st-bad{color:var(--bad)}.st-mute{color:var(--muted)}
.feed{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.feed:first-child{border-top:0}
.pill.k-shift{background:var(--info-soft);color:var(--info)}.pill.k-pay{background:var(--ok-soft);color:var(--ok)}.pill.k-cash{background:var(--bad-soft);color:var(--bad)}
.pill.k-msg{background:#E3F6EA;color:#157A3F}.pill.k-course{background:var(--teal-soft);color:var(--teal)}.pill.k-contact,.pill.k-rdv,.pill.k-other{background:var(--gold-soft);color:var(--gold-ink)}
.pill.p-live{background:var(--teal);color:#fff}
.pill.k-shift::before,.pill.k-pay::before,.pill.k-cash::before,.pill.k-msg::before,.pill.k-course::before,.pill.k-contact::before,.pill.k-rdv::before,.pill.k-other::before{display:none}
.who .me{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;border-radius:10px;padding:4px;margin:-4px}
.who .me:hover{background:rgba(255,255,255,.07)}
.who .me .av{box-shadow:0 0 0 2px rgba(201,168,76,.6)}
.who .link{display:block}
.mb-top .me{all:unset;cursor:pointer;margin-left:auto}
.mb-top .me+button{margin-left:6px}
.shift-mini{margin-top:10px;font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.shift-mini button{all:unset;cursor:pointer;background:#C9A84C;color:#1B2A4A;font-weight:700;border-radius:7px;padding:4px 9px;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA3B2;display:inline-block}.dot.on{background:#4CC08A}.dot.off{background:#EE746B}
.shiftcard{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.shiftcard.off{border-color:var(--gold);background:var(--gold-soft)}
.shiftcard.on{border-left:4px solid var(--ok)}
.livecard{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--teal);background:var(--teal-soft);margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 6px;font-weight:600;font-size:13.5px}
.chip:not(:has(.av)){padding-left:12px}
.chip.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.of_line{display:grid;grid-template-columns:1.1fr 1.6fr 1fr auto;gap:6px;margin-bottom:6px}
.of_line select,.of_line input{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-width:0;width:100%}
@media (max-width:560px){.of_line{grid-template-columns:1fr 1fr}.of_line .ol_l{grid-column:1/-1;order:-1}}
.ph-list{display:flex;gap:8px;flex-wrap:wrap}
.ph-th{position:relative;width:96px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.ph-th img{width:100%;height:100%;object-fit:cover}
.ph-th button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1}
.datebox{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold-ink);border-radius:10px;width:52px;height:52px;line-height:1}
.datebox b{font-size:20px}.datebox span{font-size:11px;text-transform:uppercase;font-weight:700;margin-top:3px}
.datebox.big{width:64px;height:64px;flex:none}.datebox.big b{font-size:24px}
.post{overflow:hidden}
.post-ph{display:flex;height:130px;gap:2px;background:var(--surface2)}
.post-ph img{flex:1;min-width:0;object-fit:cover}
#cashgrid{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:900px){#cashgrid{grid-template-columns:minmax(0,1fr)!important}}

/* public showcase */
.pub{background:var(--bg);min-height:100%}
.pub-wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.pub-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(27,42,74,.97);color:#fff;padding-block:10px}
.pub-top .logo{width:38px;height:38px}
.pub-brand{font-family:var(--brand);letter-spacing:.04em;color:#E6CF8C;font-size:15px}
.pub-login{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.pub-login:hover{border-color:#C9A84C}
.pub-hero{background:#1B2A4A;color:#fff;padding-block:40px 48px;border-bottom:4px solid #C9A84C}
.pub-hero-in{display:grid;grid-template-columns:240px 1fr;gap:36px;align-items:center}
.pub-logo{width:240px;height:240px;border-radius:50%;box-shadow:0 0 0 6px rgba(201,168,76,.35),0 20px 50px rgba(0,0,0,.35)}
.pub-kicker{color:#E6CF8C;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px;margin:0 0 8px}
.pub-hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.1}
.pub-lead{font-size:16.5px;max-width:60ch;opacity:.9;margin:14px 0 0}
.pub-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
@media (max-width:760px){.pub-hero-in{grid-template-columns:1fr;text-align:left}.pub-logo{width:150px;height:150px}}
.pub-sec{margin-top:44px}
.pub-sec h2{font-size:24px;margin-bottom:14px}
.pub-events{display:grid;gap:10px}
.pub-ev{display:flex;gap:16px;align-items:center;padding:14px 16px}
.pub-ev h3{font-size:17px;margin-top:6px}
.pub-prog h3{font-size:19px;margin:4px 0 8px}
.pub-price{font-size:26px;font-weight:800;color:var(--teal)}
.pub-price span{font-size:14px;color:var(--muted);font-weight:600}
.pub-benefits{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pub-benefits div{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pub-benefits svg{width:20px;height:20px;color:var(--teal);flex:none;margin-top:1px}
.pub-feed{display:grid;gap:18px;max-width:760px}
.pub-post{overflow:hidden}
.pub-ph{display:grid;gap:3px;background:var(--surface2)}
.pub-ph.n1{grid-template-columns:1fr}.pub-ph.n2{grid-template-columns:1fr 1fr}.pub-ph.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.pub-ph.n3 img:first-child{grid-row:span 2}
.pub-ph img{width:100%;height:100%;object-fit:cover;aspect-ratio:3/2;display:block;max-width:100%}
.pub-ph.n3 img{aspect-ratio:auto;min-height:140px}
.pub-post h3{font-size:18px;margin-top:4px}
.pub-cta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:40px;border:2px solid var(--gold)}
.pub-foot{background:#1B2A4A;color:rgba(255,255,255,.8);padding-block:18px;font-size:13px}

/* ===== v5 design (Stitch direction) ===== */
:root{--display:"Playfair Display",Georgia,"Times New Roman",serif;--bg:#F6F4EF;--surface2:#FAF8F3;--line:#E6E1D5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1420;--surface2:#1B2536;--line:#2A3548}}
:root[data-theme="dark"]{--bg:#0E1420;--surface2:#1B2536;--line:#2A3548}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:0}
.top h1{font-size:30px}
.sect h2{font-size:21px;display:flex;align-items:center;gap:8px}
.stat .val,.kpi-v{font-family:var(--display);font-weight:700}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:4px}
.dot-red{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block}
.brand b{font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.brand span{color:#E6CF8C;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;font-weight:700;opacity:1}
.nav button.on{background:rgba(201,168,76,.14);color:#E6CF8C;box-shadow:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.pill-soft{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.conn{font-size:12.5px;font-weight:700;color:var(--ok)}
.qa{margin:14px 0 4px}
/* welcome banner */
.welcome{background:#1B2A4A;color:#fff;border-radius:16px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(27,42,74,.18);position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(201,168,76,.18)}
.wl-id{display:flex;gap:16px;align-items:center}
.wl-id img,.wl-ini{width:74px;height:74px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #C9A84C;flex:none}
.wl-ini{display:grid;place-items:center;background:#24365C;color:#E6CF8C;font-family:var(--display);font-size:26px;font-weight:700}
.wl-eye{font-size:12px;opacity:.8}.wl-eye span{background:rgba(201,168,76,.2);color:#E6CF8C;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;border-radius:99px;padding:3px 9px;margin-right:6px}
.welcome h1{font-size:30px;margin:6px 0 2px;color:#fff}
.welcome p{margin:0;opacity:.8;font-size:14px}
.wl-chips{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.wl-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;min-width:190px}
.wl-chip small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;font-weight:700}
.wl-chip b{font-size:14.5px}
.wl-chip.hot b{color:#FFB4AC}
/* kpis */
.kpis{margin-top:14px}
button.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
button.kpi:hover{border-color:var(--gold)}
button.kpi:focus-visible{outline:2px solid var(--gold)}
.kpi-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi-h i{width:32px;height:32px;border-radius:9px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.kpi-h i svg{width:17px;height:17px}
.kpi-v{font-size:25px;line-height:1.15}
.kpi-s{font-size:12.5px;color:var(--muted)}
.kpi .bar{margin-top:6px}
/* urgent cards */
.ugrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.ugrid{grid-template-columns:minmax(0,1fr)}}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.uc-top{display:flex;gap:10px;align-items:center}
.uc-id{flex:1;min-width:0}
.uc-id b{display:block;font-size:15px;cursor:pointer}
.uc-id span{font-size:12.5px;color:var(--muted)}
.av.nv{background:#1B2A4A;color:#E6CF8C;font-family:var(--display);font-weight:700}
.av.nv.big{width:52px;height:52px;font-size:18px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-bad{background:var(--bad-soft);color:var(--bad)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-info{background:var(--info-soft);color:var(--info)}.t-gold{background:var(--gold-soft);color:var(--gold-ink)}.t-ok{background:var(--ok-soft);color:var(--ok)}
.uc-box{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;font-weight:600}
.uc-box small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.uc-box>b{color:var(--bad);font-size:17px;white-space:nowrap}
.uc-act{display:flex;gap:6px;flex-wrap:wrap}
.ub{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;flex:1 1 auto;text-decoration:none;min-width:max-content}
.ub svg{width:15px;height:15px}
.ub.wa{background:#1FA855;color:#fff}.ub.gd{background:#E5C76B;color:#3E2F05}.ub.tl{background:#0C8C87;color:#fff}.ub.lt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}.ub.nvb{background:#1B2A4A;color:#fff}
.ub:hover{filter:brightness(.95)}
.dash2{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:18px}
@media (max-width:1000px){.dash2{grid-template-columns:minmax(0,1fr)}}
.dash2 .ev{grid-template-columns:86px 1fr}
.dash2 .ev>.row:last-child{grid-column:2}
/* learner cards */
.lgrid{display:grid;gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:78px minmax(0,1fr) 300px;gap:16px;padding:16px}
.lc-av{display:flex;flex-direction:column;align-items:center;gap:6px}
.lvl{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold-ink);border-radius:6px;padding:2px 7px;text-align:center}
.lc-name{font-family:var(--display);font-size:19px;cursor:pointer}
.lc-sub{font-size:13px;color:var(--muted);margin-top:2px;font-weight:600}
.lc-meta{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);margin-top:8px}
.lc-att{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12.5px;margin-top:10px;max-width:420px}
.lc-att span{color:var(--muted);font-weight:600}
.lc-side{border-left:1px solid var(--line);padding-left:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.lc-due{font-family:var(--display);font-size:21px;font-weight:700}
.lc-act{display:flex;gap:6px}
.lc-act .ub{flex:1;padding:8px 6px;font-size:12.5px}
@media (max-width:900px){.lcard{grid-template-columns:56px minmax(0,1fr)}.lc-side{grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}.av.nv.big{width:48px;height:48px}}
/* login */
.login2{min-height:100%;background:var(--bg);padding-block:24px 40px;padding-inline:16px}
.login2-in{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.lcard2{background:var(--surface);border-radius:18px;border-top:5px solid #1B2A4A;box-shadow:0 10px 40px rgba(27,42,74,.12);padding:28px 24px}
.lcard2 .hero{text-align:center}
.lcard2 .hero img{width:110px;height:110px;border-radius:50%}
.lcard2 h1{font-size:clamp(26px,4vw,36px);margin:4px 0}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.roles{grid-template-columns:1fr}}
.rolecard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.rolecard.on{border-color:var(--gold);background:var(--gold-soft)}
.rolecard:focus-visible{outline:2px solid var(--gold)}
.rolecard b{font-size:15px}.rolecard .rs{font-size:11.5px;color:var(--gold-ink);font-weight:700}.rolecard .rd{font-size:12.5px;color:var(--muted)}
.demo2{max-width:420px;margin:18px auto 0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
/* public v5 */
.pub-nav{display:flex;align-items:center;justify-content:space-between;gap:14px}
.pub-id{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.pub-id small{display:block;color:#E6CF8C;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.pub-brand{font-family:var(--display);font-size:17px;letter-spacing:.02em;color:#fff}
.pub-links{display:flex;gap:18px}
.pub-links a{color:rgba(255,255,255,.85);text-decoration:none;font-weight:600;font-size:14px}
.pub-links a:hover{color:#E6CF8C}
@media (max-width:900px){.pub-links{display:none}.pub-wa span{display:none}}
.pub-hero{padding-block:44px 34px;background:radial-gradient(circle at 85% 30%,#243a66 0,#1B2A4A 55%)}
.pub-hero-in{grid-template-columns:1fr 300px}
.pub-hero h1{font-size:clamp(32px,5vw,54px);line-height:1.08}
.pub-hero h1 em{color:#E6CF8C;font-style:italic}
.hb{display:inline-flex;gap:6px;align-items:center;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:700;color:#E6CF8C}
.hb.g{color:#8FE0B0}
.pub-seal{text-align:center}
.pub-seal img{width:260px;height:260px;border-radius:50%;box-shadow:0 0 0 8px rgba(201,168,76,.2),0 25px 60px rgba(0,0,0,.4)}
.pub-seal b{display:block;font-family:var(--display);color:#E6CF8C;font-size:17px;margin-top:16px}
.pub-seal small{display:block;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;opacity:.7;margin-top:4px}
@media (max-width:820px){.pub-hero-in{grid-template-columns:1fr}.pub-seal{order:-1}.pub-seal img{width:150px;height:150px}.pub-seal b,.pub-seal small{display:none}}
.pub-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:30px}
.pub-stats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px}
.pub-stats b{display:block;font-family:var(--display);font-size:28px;color:#E6CF8C}
.pub-stats span{font-size:13px;opacity:.85}
@media (max-width:700px){.pub-stats{grid-template-columns:1fr 1fr}}
.pub-band{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;font-size:14px}
.pub-sec h2{font-size:clamp(24px,3.4vw,32px)}
.pub-progs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.pprog{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-height:300px}
.pprog h3{font-family:var(--display);font-size:22px;margin:2px 0 8px}
.pprog.feat{background:#1B2A4A;color:#fff;border-color:#1B2A4A}
.pprog.feat .lab,.pprog.feat .pp-lab{color:#E6CF8C}
.pprog.feat .pp-tiers,.pprog.feat .pp-test{color:rgba(255,255,255,.8)}

      if (at && at.streak >= DB.settings.absenceAlert) out.push({lv:"warn", l, key:"absence", title:`${l.name} — absent·e aux ${at.streak} derniers cours`, sub:`Assiduité ${at.rate} % · ${group(l.groupId)?.name}${rel}`});
    }
    if (l.stage === "test" && l.testDate) {
      const dd = diffDays(l.testDate, TODAY);
      if (dd >= 0 && dd <= 1) out.push({lv:"info", l, key:"test", title:`${l.name} — test de placement ${dd === 0 ? "aujourd'hui" : "demain"}`, sub:`${p?.name} · frais ${money(p?.testFee)} ${a.testPaid ? "(payés)" : "(non payés)"}${rel}`});
      else if (dd < 0) out.push({lv:"warn", l, key:"suivi", title:`${l.name} — test passé, inscription à finaliser`, sub:`Test du ${fd(l.testDate)} · ${a.testPaid ? "frais de test payés" : "frais de test NON payés"}${rel}`, advance:true, pay:!a.testPaid});
    }
    if (l.stage === "prospect") {
      const dd = diffDays(TODAY, l.lastMsg || l.created);
      if (dd >= 2) out.push({lv:"gold", l, key:"suivi", title:`${l.name} — prospect sans suite depuis ${dd} j`, sub:`Intéressé·e par ${p?.name} · ${l.source}${rel}`, advance:true});
    }
  });
  const order = {bad:0, warn:1, info:2, gold:3};
  return out.sort((a, b) => order[a.lv] - order[b.lv]);
}
function fill(tplKey, l, extra = {}) {
  const t = DB.settings.tpl[tplKey], p = prog(l.programId), a = account(l), g = group(l.groupId), at = attendance(l);
  const vars = Object.assign({
    nom: l.name.split(" ")[0], programme: p?.name || "", solde: money(a.balance), montant: money(a.due),
    echeance: a.end ? fd(a.end) : "—", date_test: l.testDate ? fds(l.testDate) : "—", frais_test: money(p?.testFee),
    horaires: g ? groupLabel(g) : "à confirmer", tel_vla: telsVLA(), absences: at ? at.streak : "",
    date_promesse: l.promise ? fd(l.promise.date) : "—",
  }, extra);
  const f = s => s.replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
  if (l.lang === "en") return f(t.en);
  if (l.lang === "both") return f(t.fr) + "\n\n———\n\n" + f(t.en);
  return f(t.fr);
}

function staffStatus(u) {

  if (live) { const s = sessByKey(live[0]); return {lv:"live", t:`En cours : ${s ? group(s.groupId)?.name : "cours"} depuis ${live[1].start}`}; }

}

function sessByKey(key) {

function staffAlerts() {

  DB.team.filter(t => t.active && !t.deleted && t.role === "secretaire").forEach(t => {

  sessionsOn(TODAY).forEach(s => {
    if (s.cancelled || s.report) return;
    const t = member(s.teacherId), g = group(s.groupId), lv = DB.live[s.key];
    if (!lv && now > hm(s.start) + 15 && now < hm(s.end)) out.push({lv:"bad", u:t, title:`${g.name} devait commencer à ${s.start}`, sub:`${t.name} n'a pas encore démarré le cours`, wa:`Bonjour ${t.name.split(" ")[0]}, le cours ${g.name} était prévu à ${s.start}. Peux-tu le démarrer dans VLA Gestion ?`, go:"planning"});
    if (lv && now > hm(s.end) + 30) out.push({lv:"warn", u:t, title:`${g.name} : cours toujours ouvert`, sub:`Démarré à ${lv.start}, fin prévue ${s.end}. ${t.name} n'a pas cliqué sur « Terminer »`, wa:`Bonjour ${t.name.split(" ")[0]}, pense à terminer le cours ${g.name} dans VLA Gestion.`});

      <button class="btn sm ghost" data-open="${a.l.id}">Fiche</button>

function dayEvents(date) {
  const ev = [];
  sessionsOn(date).filter(s => !isTch() || s.teacherId === S.user.id).forEach(s => ev.push({h:s.start, kind:"cours", s}));
  if (!isTch()) {
    DB.learners.filter(l => l.testDate === date && l.stage === "test").forEach(l => ev.push({h:"~", kind:"test", l}));
    DB.appts.filter(a => a.date === date).forEach(a => ev.push({h:a.time, kind:"rdv", a}));
  }
  return ev.sort((a, b) => a.h.localeCompare(b.h));
}
function evRow(e, showDate) {
  const dt = showDate ? `<span class="small muted" style="display:block;font-weight:700">${fds(e.s?.date || e.a?.date)}</span>` : "";
  if (e.kind === "cours") {
    const s = e.s, g = group(s.groupId), t = member(s.teacherId), st = sessStatus(s), lv = DB.live[s.key];
    const pill = {fait:`<span class="pill p-ok num">${s.report?.live ? "Chronométré" : "Déclaré"} ${s.report?.start}–${s.report?.end}</span>`, manque:`<span class="pill p-bad">Non déclaré</span>`, prevu:`<span class="pill p-info">Prévu</span>`, annule:`<span class="pill p-mute">Annulé</span>`, encours:`<span class="pill p-live">En cours depuis ${lv?.start}</span>`}[st];
    const mineS = s.teacherId === S.user.id;
    let acts = "";
    if (mineS && st === "encours") acts = `<button class="btn sm pri" data-a="endSess" data-id="${s.key}">Terminer le cours</button>`;
    else if (mineS && canStart(s)) acts = `<button class="btn sm gold" data-a="startSess" data-id="${s.key}">▶ Démarrer le cours</button>`;
    else if (mineS && st === "manque") acts = `<button class="btn sm gold" data-a="report" data-id="${s.key}">Déclarer</button>`;
    else if (mineS && st === "fait") acts = `<button class="btn sm" data-a="report" data-id="${s.key}">Voir / modifier</button><button class="btn sm ${s.report.recap ? "" : "gold"}" data-a="recap" data-id="${s.key}">📝 ${s.report.recap ? "Récap ✓" : "Faire le récap"}</button>`;
    else if (isMgr()) {
      if (st === "fait" || st === "encours") acts = st === "fait" ? `<button class="btn sm" data-a="report" data-id="${s.key}">Détails</button><button class="btn sm" data-a="recap" data-id="${s.key}">📝 ${s.report.recap ? "Récap ✓" : "Récap"}</button>` : "";
      else if (st === "manque") acts = waBtnTeacher(t, g, s) + `<button class="btn sm" data-a="report" data-id="${s.key}">Déclarer</button>`;
      else if (st === "prevu") acts = `<button class="btn sm ghost" data-a="cancelSess" data-id="${s.key}">Annuler</button>`;
      else acts = `<button class="btn sm ghost" data-a="restoreSess" data-id="${s.key}">Rétablir</button>`;
      if (s.extra && st !== "fait" && st !== "encours") acts += `<button class="btn sm ghost danger" data-a="delExtra" data-id="${s.xid}">Supprimer</button>`;
    }
    const sub = [s.report?.level || prog(g.programId)?.name, g.room, s.extra ? (s.note || "Séance supplémentaire") : "", s.cancelled ? "Motif : " + s.cancelled : "", s.report ? s.report.content + " · " + s.report.present.length + " présent(s)" : ""].filter(Boolean).join(" · ");
    return `<div class="ev"><div class="h">${dt}${s.start}–${s.end}</div><div class="row" style="flex-wrap:nowrap;gap:10px">${avatar(t, 30)}<div><b>${esc(g.name)}</b> <span class="small muted">· ${esc(t?.name || "")}</span><div class="small muted">${esc(sub)}</div></div></div><div class="row">${pill}${acts}</div></div>`;
  }
  if (e.kind === "test") return `<div class="ev"><div class="h">Test</div><div><b>Test de placement — ${esc(e.l.name)}</b><div class="small muted">${esc(prog(e.l.programId)?.name)}</div></div><div class="row"><button class="btn sm" data-open="${e.l.id}">Fiche</button></div></div>`;
  const by = member(e.a.by);
  return `<div class="ev"><div class="h">${dt}${e.a.time}</div><div><b>${esc(e.a.title)}</b><div class="small muted">${esc([e.a.place, e.a.note, by ? "programmé par " + by.name.split(" ")[0] : ""].filter(Boolean).join(" · "))}</div></div><div class="row"><span class="pill p-gold">Rendez-vous</span>${!isTch() ? `<button class="btn sm ghost" data-a="editAppt" data-id="${e.a.id}" aria-label="Modifier">${ICON.edit}</button>` : ""}</div></div>`;
}

    const sh = DB.shifts.filter(x => x.u === t.id && x.date === d);

    const mins = sh.reduce((a, x) => a + (x.in && x.out ? hm(x.out) - hm(x.in) : x.in && d === TODAY ? hm(nowHM()) - hm(x.in) : 0), 0);
    const pays = validPays().filter(p => p.by === t.id && p.date === d);
    const outs = DB.expenses.filter(e => e.by === t.id && e.date === d && e.kind !== "apport");
    const courses = sessionsOn(d).filter(s => s.report && s.report.by === t.id);
    const msgs = DB.log.filter(x => x.u === t.id && x.k === "msg" && x.at.startsWith(d)).length;
    return {t, first, last, mins, pays, outs, courses, msgs, open: sh.some(x => x.in && !x.out)};

  <div class="top"><div><h1>Suivi de l'équipe</h1><p class="muted">Arrivées, départs, cours, encaissements, sorties d'argent et messages de chacun</p></div></div>

  <div class="card tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Personne</th><th>Arrivée</th><th>Départ</th><th class="right">Temps au centre</th><th class="right">Cours donnés</th><th class="right">Encaissé</th><th class="right">Sorties</th><th class="right">Messages</th></tr></thead><tbody>
  ${rows.filter(r => !S.actUser || r.t.id === S.actUser).map(r => `<tr><td><div class="row" style="flex-wrap:nowrap">${avatar(r.t, 32)}<div><b>${esc(r.t.name)}</b><div class="small muted">${ROLE_L[r.t.role]}</div></div></div></td>
    <td class="num">${r.first || `<span class="muted">—</span>`}</td><td class="num">${r.last || (r.open ? `<span class="pill p-ok">Au centre</span>` : `<span class="muted">—</span>`)}</td>
    <td class="right num">${r.mins ? Math.floor(r.mins / 60) + " h " + pad(r.mins % 60) : "—"}</td>
    <td class="right num">${r.courses.length ? r.courses.length + " (" + fh(r.courses.reduce((a, s) => a + hoursOf(s.report), 0)) + ")" : "—"}</td>
    <td class="right num">${r.pays.length ? money(r.pays.reduce((a, p) => a + p.amount, 0)) : "—"}</td>
    <td class="right num">${r.outs.length ? `<span style="color:var(--bad)">− ${money(r.outs.reduce((a, e) => a + e.amount, 0))}</span>` : "—"}</td>
    <td class="right num">${r.msgs || "—"}</td></tr>`).join("")}
  </tbody></table></div>
  ${who.filter(t => t.role !== "secretaire" && t.role !== "manager").map(t => { const cs = sessionsOn(d).filter(s => s.teacherId === t.id || s.report?.by === t.id); return cs.length ? `<div class="sect"><h2>Cours de ${esc(t.name.split(" ")[0])}</h2></div><div class="card">${cs.map(s => evRow({kind:"cours", s})).join("")}</div>` : ""; }).join("")}

  <div class="card">${log.length ? log.map(feedRow).join("") : `<div class="empty">Aucune action ce jour-là.</div>`}</div>`;

  if (S.payQ) { const q = S.payQ.toLowerCase(); pays = pays.filter(p => (learner(p.learnerId)?.name + " " + p.receipt + " " + p.objet).toLowerCase().includes(q)); }
  const valid = pays.filter(p => !p.cancelled);
  const debt = DB.learners.map(l => ({l, a:account(l)})).filter(x => x.a.balance > 0 || (x.l.stage === "formation" && x.a.daysLeft < 0)).sort((x, y) => y.a.balance - x.a.balance);
  const debtTotal = debt.reduce((s, x) => s + (x.a.daysLeft < 0 ? x.a.due : x.a.balance), 0);
  // cash of the day
  const day = validPays().filter(p => p.date === S.cashDate);
  const byMethod = METHODS.map(m => [m, day.filter(p => p.method === m).reduce((a, p) => a + p.amount, 0)]).filter(x => x[1]);
  const byStaff = [...new Set(day.map(p => p.by))].map(u => [member(u)?.name || "?", day.filter(p => p.by === u).reduce((a, p) => a + p.amount, 0), day.filter(p => p.by === u && p.method === "Espèces").reduce((a, p) => a + p.amount, 0)]);
  const months = [...new Set(DB.payments.map(p => p.date.slice(0, 7)).concat(THIS_MONTH))].sort().reverse();
  return `
  <div class="top"><div><h1>Paiements</h1><p class="muted">Chaque encaissement génère un reçu numéroté, prêt à partir sur WhatsApp</p></div><button class="btn pri" data-a="newPayment">${ICON.plus}Encaisser un paiement</button></div>
  <div class="grid g2" style="align-items:start">
    <div class="card"><div class="mh"><h3>Caisse du jour</h3><input type="date" id="cashDate" value="${S.cashDate}" style="background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 8px"></div>
      <div class="mb">${day.length ? `<div class="stat" style="padding:0 0 10px"><div class="val num">${money(day.reduce((a, p) => a + p.amount, 0))}</div><div class="sub">${day.length} paiement${day.length > 1 ? "s" : ""} le ${fd(S.cashDate)}</div></div>
        <dl class="kv">${byMethod.map(([m, v]) => `<dt>${m}</dt><dd class="num">${money(v)}</dd>`).join("")}</dl>
        <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px"><div class="lab" style="margin-bottom:6px">Par personne (espèces à remettre)</div><dl class="kv">${byStaff.map(([n, v, c]) => `<dt>${esc(n)}</dt><dd class="num">${money(v)} <span class="muted" style="font-weight:500">· espèces ${money(c)}</span></dd>`).join("")}</dl></div>`
        : `<div class="empty">Aucun encaissement ce jour-là.</div>`}</div></div>
    <div class="card"><div class="mh"><h3>Impayés & renouvellements</h3><b class="num" style="color:var(--bad)">${money(debtTotal)}</b></div>
      <div class="list">${debt.length ? debt.map(({l, a}) => `<div class="li"><div class="av" style="background:var(--bad-soft);color:var(--bad)">${initials(l.name)}</div><div><div class="t" data-open="${l.id}" style="cursor:pointer">${esc(l.name)}</div><div class="s">${a.daysLeft < 0 ? `Expirée le ${fd(a.end)} · ${money(a.due)}` : `Reste ${money(a.balance)}${a.end ? " · échéance " + fd(a.end) : ""}`}${l.promise && l.promise.date >= TODAY ? " · promet le " + fds(l.promise.date) : ""}</div></div><div class="r"><button class="btn sm wa" data-a="wa" data-id="${l.id}" data-k="${a.daysLeft < 0 ? "expiration" : "relance"}">${ICON.wa}Relancer</button></div></div>`).join("") : `<div class="empty">Aucun impayé.</div>`}</div></div>
  </div>
  <div class="sect"><h2>Journal des encaissements</h2></div>
  <div class="tools" style="margin-top:0"><select id="payMonth" aria-label="Mois">${months.map(m => `<option value="${m}" ${m === ym ? "selected" : ""}>${fm(m)}</option>`).join("")}</select><input id="payQ" type="search" placeholder="Nom, n° de reçu, objet…" value="${esc(S.payQ)}"><button class="btn" data-a="copyPays">${ICON.copy}Copier pour Excel</button></div>
  <div class="card tbl-wrap"><table><thead><tr><th>Date</th><th>Reçu</th><th>Apprenant</th><th>Objet</th><th>Mode</th><th>Par</th><th class="right">Montant</th><th></th></tr></thead><tbody>
  ${pays.length ? pays.map(p => { const l = learner(p.learnerId); return `<tr class="${p.cancelled ? "strike" : ""}"><td class="num">${fd(p.date)}</td><td class="num small">${esc(p.receipt)}</td><td>${esc(l?.name || "Fiche supprimée")}</td><td>${esc(p.objet)}${p.cancelled ? ` <span class="pill p-bad">Annulé</span>` : ""}</td><td>${esc(p.method)}</td><td class="small">${esc(member(p.by)?.name.split(" ")[0] || "")}</td><td class="right num"><b>${money(p.amount)}</b></td><td class="right"><button class="btn sm" data-a="receipt" data-id="${p.id}">Reçu</button></td></tr>`; }).join("") : `<tr><td colspan="8" class="empty">Aucun paiement.</td></tr>`}
  </tbody></table></div>
  <p class="small muted">Total valide du mois : <b class="num">${money(valid.reduce((a, p) => a + p.amount, 0))}</b>. Un paiement annulé reste visible barré, avec son motif, pour garder la trace.</p>`;
};

/* ---------- PLANNING ---------- */
views.planning = () => {
  const tabs = `<div class="tabs"><button class="${S.planTab === "agenda" ? "on" : ""}" data-plan="agenda">Agenda</button><button class="${S.planTab === "groups" ? "on" : ""}" data-plan="groups">Groupes & horaires</button><button class="${S.planTab === "appts" ? "on" : ""}" data-plan="appts">Rendez-vous</button></div>`;
  let body = "";
  if (S.planTab === "agenda") {
    const start = addDays(TODAY, S.week * 7);
    body = `<div class="row" style="justify-content:space-between"><div class="row"><button class="btn sm" data-a="week" data-n="-1">← Semaine précédente</button>${S.week ? `<button class="btn sm" data-a="week" data-n="0">Aujourd'hui</button>` : ""}<button class="btn sm" data-a="week" data-n="1">Semaine suivante →</button></div>${isMgr() ? `<button class="btn sm" data-a="newExtra">${ICON.plus}Séance de rattrapage</button>` : ""}</div>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i), ev = dayEvents(d);
      body += `<div class="day"><h3>${d === TODAY ? "Aujourd'hui" : d === addDays(TODAY, 1) ? "Demain" : JOURS_L[wd(d)]} · ${fd(d)}</h3><div class="card">${ev.length ? ev.map(e => evRow(e)).join("") : `<div class="empty small">Rien de prévu.</div>`}</div></div>`;
    }
  } else if (S.planTab === "groups") {
    body = `${isMgr() ? `<div class="row" style="margin-bottom:12px"><button class="btn" data-a="newGroup">${ICON.plus}Nouveau groupe</button></div>` : ""}<div class="grid g2">${DB.groups.map(g => { const ls = groupMembers(g), pc = Math.min(100, Math.round(ls.length / (g.capacity || 1) * 100)); return `<div class="card pad"><div class="row" style="justify-content:space-between"><h3 style="font-size:17px">${esc(g.name)}</h3>${isMgr() ? `<button class="btn sm ghost" data-a="editGroup" data-id="${g.id}">${ICON.edit}Modifier</button>` : ""}</div><p class="small muted" style="margin:6px 0 10px">${esc(prog(g.programId)?.name || "")} · ${esc(groupLabel(g))} · ${esc(g.room)} · ${esc(member(g.teacherId)?.name || "Sans formateur")}</p><div class="row small" style="justify-content:space-between"><span>${ls.length} / ${g.capacity} places</span><span class="muted">${g.capacity - ls.length > 0 ? g.capacity - ls.length + " libre(s)" : "Complet"}</span></div><div class="bar ${pc >= 100 ? "bad" : "gold"}" style="margin:6px 0 10px"><i style="width:${pc}%"></i></div><div class="small">${ls.map(l => `<span data-open="${l.id}" style="cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)">${esc(l.name)}</span>`).join(", ") || "<span class='muted'>Aucun apprenant</span>"}</div></div>`; }).join("")}</div>`;
  } else {
    const list = DB.appts.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const up = list.filter(a => a.date >= TODAY), past = list.filter(a => a.date < TODAY).reverse().slice(0, 10);
    body = `<div class="card">${up.length ? up.map(a => evRow({kind:"rdv", a}, true)).join("") : `<div class="empty">Aucun rendez-vous à venir.</div>`}</div>${past.length ? `<div class="day"><h3>Passés</h3><div class="card">${past.map(a => evRow({kind:"rdv", a}, true)).join("")}</div></div>` : ""}`;
  }
  return `<div class="top"><div><h1>Cours & agenda</h1><p class="muted">Cours des groupes, tests de placement et rendez-vous</p></div><button class="btn pri" data-a="newAppt">${ICON.plus}Rendez-vous</button></div>${tabs}${body}`;
};

/* ---------- TEAM ---------- */

  ${recent.map(s => { const g = group(s.groupId), st = sessStatus(s); return `<tr><td class="num">${fds(s.date)}</td><td>${esc(g.name)}</td><td>${esc(member(s.teacherId)?.name || "")}</td><td class="num">${s.start}–${s.end}</td><td>${{fait:`<span class="pill p-ok num">${s.report?.start}–${s.report?.end}</span>`, manque:`<span class="pill p-bad">Non déclaré</span>`, prevu:`<span class="pill p-info">À venir</span>`, annule:`<span class="pill p-mute">Annulé</span>`}[st]}</td><td class="small">${s.report ? esc(s.report.content) : s.cancelled ? esc(s.cancelled) : "—"}</td><td class="right num">${s.report ? s.report.present.length : "—"}</td><td class="right">${st === "fait" || st === "manque" ? `<button class="btn sm" data-a="report" data-id="${s.key}">${st === "fait" ? "Détails" : "Déclarer"}</button>` : ""}</td></tr>`; }).join("")}

    <td class="right"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><a class="btn sm wa" target="_blank" rel="noopener" href="${waLink(t.phone, `Bonjour ${t.name.split(" ")[0]}, voici ton accès à VLA Gestion.\nPseudo : ${t.pseudo}\nCode : ${t.code}\nGarde ce code pour toi.`)}">${ICON.wa}Envoyer</a><button class="btn sm" data-a="newCode" data-id="${t.id}">Nouveau code</button><button class="btn sm ghost" data-a="editMember" data-id="${t.id}" aria-label="Modifier">${ICON.edit}</button></div></td></tr>`).join("")}

};

/* ---------- CASH (manager) ---------- */
function cashBalance() {
  const op = DB.settings.opening, by = {};
  const add = (m, v) => by[m] = (by[m] || 0) + v;
  Object.entries(op.by || {"Espèces":op.amount || 0}).forEach(([m, v]) => add(m, v));
  validPays().filter(p => p.date >= op.date).forEach(p => add(p.method, p.amount));
  DB.expenses.filter(e => e.date >= op.date).forEach(e => add(e.method, e.kind === "apport" ? e.amount : -e.amount));
  return {by, total:Object.values(by).reduce((a, v) => a + v, 0)};
}
function movements(filterFn) {
  const mv = [];
  validPays().forEach(p => mv.push({date:p.date, time:"", type:"in", label:`${p.objet} — ${learner(p.learnerId)?.name || "Fiche supprimée"}`, ref:p.receipt, by:p.by, method:p.method, amount:p.amount, pay:p.id}));
  DB.expenses.forEach(e => mv.push({date:e.date, time:e.time || "", type:e.kind === "apport" ? "in" : "out", label:e.label, cat:e.cat, ref:e.ref || "", by:e.by, method:e.method, amount:e.amount, exp:e.id, kind:e.kind || "depense"}));
  return mv.filter(filterFn || (() => true)).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
}
const isExpense = e => !e.kind || e.kind === "depense";
views.cash = () => {
  const ym = S.month, bal = cashBalance();
  const mv = movements(m => m.date.startsWith(ym) && (S.cashFilter === "all" || m.type === S.cashFilter));
  const monthIn = movements(m => m.date.startsWith(ym) && m.type === "in").reduce((a, m) => a + m.amount, 0);
  const monthOut = movements(m => m.date.startsWith(ym) && m.type === "out").reduce((a, m) => a + m.amount, 0);
  const exps = DB.expenses.filter(e => e.date.startsWith(ym) && isExpense(e));
  const tot = exps.reduce((a, e) => a + e.amount, 0);
  const byCat = EXP_CATS.map(c => [c, exps.filter(e => e.cat === c).reduce((a, e) => a + e.amount, 0)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  return `
  <div class="top"><div><h1>Caisse</h1><p class="muted">Tout l'argent qui entre et qui sort, et qui l'a fait. L'application ne garde pas l'argent : elle tient les comptes.</p></div>
    <div class="row"><button class="btn pri" data-a="newOutflow">${ICON.out}Sortie d'argent</button><button class="btn" data-a="newApport">${ICON.plus}Apport / autre entrée</button></div></div>
  <div class="grid g4">
    <div class="card stat" style="grid-column:span 1"><div class="lab">Solde actuel</div><div class="val num">${money(bal.total)}</div><div class="sub">tous modes confondus</div></div>
    ${METHODS.slice(0, 3).map(m => `<div class="card stat"><div class="lab">${m}</div><div class="val num" style="font-size:21px">${money(bal.by[m] || 0)}</div><div class="sub">${m === "Espèces" ? "doit être dans la caisse" : "sur le compte"}</div></div>`).join("")}
  </div>
  <div class="sect"><h2>Mouvements</h2></div>
  ${monthPicker()}
  <div class="grid g3" style="margin-bottom:14px">
    <div class="card stat"><div class="lab">Entrées du mois</div><div class="val num" style="color:var(--ok)">+ ${money(monthIn)}</div></div>
    <div class="card stat"><div class="lab">Sorties du mois</div><div class="val num" style="color:var(--bad)">− ${money(monthOut)}</div></div>
    <div class="card stat"><div class="lab">Différence</div><div class="val num">${money(monthIn - monthOut)}</div></div>
  </div>
  <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start" id="cashgrid">
    <div><div class="chips" style="margin-bottom:10px">${[["all","Tout"],["in","Entrées"],["out","Sorties"]].map(([k, l]) => `<button class="chip ${S.cashFilter === k ? "on" : ""}" data-a="cashFilter" data-k="${k}">${l}</button>`).join("")}</div>
    <div class="card tbl-wrap"><table><thead><tr><th>Date</th><th>Mouvement</th><th>Par</th><th>Mode</th><th class="right">Montant</th><th></th></tr></thead><tbody>
    ${mv.length ? mv.map(m => { const u = member(m.by); return `<tr><td class="num small" style="white-space:nowrap">${fds(m.date)}${m.time ? "<br>" + m.time : ""}</td><td>${esc(m.label)}<div class="small muted">${m.cat ? esc(m.cat) + " · " : ""}${esc(m.ref)}</div></td><td><div class="row" style="flex-wrap:nowrap;gap:6px">${avatar(u, 26)}<span class="small">${esc(u?.name.split(" ")[0] || "")}</span></div></td><td class="small">${esc(m.method)}</td><td class="right num" style="white-space:nowrap"><b style="color:${m.type === "in" ? "var(--ok)" : "var(--bad)"}">${m.type === "in" ? "+" : "−"} ${money(m.amount)}</b></td><td class="right">${m.exp ? `<button class="btn sm ghost" data-a="editExpense" data-id="${m.exp}" aria-label="Modifier">${ICON.edit}</button>` : `<button class="btn sm ghost" data-a="receipt" data-id="${m.pay}">${ICON.receipt}</button>`}</td></tr>`; }).join("") : `<tr><td colspan="6" class="empty">Aucun mouvement.</td></tr>`}
    </tbody></table></div></div>
    <div class="card pad"><div class="lab">Dépenses de ${fm(ym)} par poste</div><div style="font-size:22px;font-weight:800" class="num">${money(tot)}</div>
      <div class="f" style="gap:8px;margin-top:12px">${byCat.map(([c, v]) => `<div><div class="row small" style="justify-content:space-between"><span>${c}</span><b class="num">${money(v)}</b></div><div class="bar gold"><i style="width:${Math.round(v / (tot || 1) * 100)}%"></i></div></div>`).join("") || `<div class="empty">Aucune dépense.</div>`}</div>
      <p class="small muted" style="margin-bottom:0">Les retraits de la directrice et les apports ne comptent pas comme dépenses du centre.</p></div>
  </div>`;
};
/* ---------- OUTFLOWS (secretary) ---------- */
views.outflows = () => {
  const mine = DB.expenses.filter(e => e.by === S.user.id && e.kind !== "apport").sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")));
  const refs = [...new Set(mine.map(e => e.ref || e.id))];
  return `
  <div class="top"><div><h1>Sorties d'argent</h1><p class="muted">Chaque dépense que vous faites avec l'argent du centre. Elle est retirée de la caisse et la directrice la voit tout de suite.</p></div><button class="btn pri" data-a="newOutflow">${ICON.plus}Nouvelle sortie</button></div>
  <div class="card">${refs.length ? refs.map(r => { const lines = mine.filter(e => (e.ref || e.id) === r), f = lines[0]; return `<div class="li" style="grid-template-columns:auto 1fr auto"><div class="av" style="background:var(--bad-soft);color:var(--bad)">${ICON.out.replace("<svg", '<svg width="18" height="18"')}</div><div><div class="t">${lines.map(l => esc(l.label)).join(" + ")}</div><div class="s">${fds(f.date)}${f.time ? " à " + f.time : ""} · ${esc(f.method)}${f.ref ? " · " + esc(f.ref) : ""}</div></div><div class="r"><b class="num" style="color:var(--bad)">− ${money(lines.reduce((a, l) => a + l.amount, 0))}</b>${f.date === TODAY ? `<button class="btn sm ghost" data-a="editExpense" data-id="${f.id}">Corriger</button>` : ""}</div></div>`; }).join("") : `<div class="empty">Aucune sortie enregistrée.</div>`}</div>
  <p class="small muted">Exemple : achat d'une cartouche d'encre 8 000 F + transport 1 000 F. Mettez les deux lignes dans la même sortie. Vous pouvez corriger une sortie le jour même ; ensuite seule la directrice peut la modifier.</p>`;
};
function monthPicker() {
  return `<div class="tools" style="margin-top:0"><button class="btn sm" data-a="month" data-n="-1">← Mois précédent</button><b style="min-width:150px;text-align:center;text-transform:capitalize">${fm(S.month)}</b><button class="btn sm" data-a="month" data-n="1" ${S.month >= THIS_MONTH ? "disabled" : ""}>Mois suivant →</button></div>`;
}

/* ---------- TEACHER ---------- */
views.mycourses = () => {
  const mine = s => s.teacherId === S.user.id;
  const todo = sessionsBetween(addDays(TODAY, -21), addDays(TODAY, -1)).filter(s => mine(s) && sessStatus(s) === "manque");
  const today = sessionsOn(TODAY).filter(s => mine(s) || s.report?.by === S.user.id);
  const upcoming = sessionsBetween(addDays(TODAY, 1), addDays(TODAY, 7)).filter(mine);
  const done = sessionsBetween(addDays(TODAY, -21), TODAY).filter(s => s.report && s.report.by === S.user.id).reverse().slice(0, 10);
  const noRecap = done.filter(s => !s.report.recap);
  const x = teacherMonth(S.user, THIS_MONTH);

function startNow(gid) {
  const g = group(gid), now = nowHM();
  let s = sessionsOn(TODAY).find(x => x.groupId === gid && !x.report && !x.cancelled && !DB.live[x.key]);
  let key;
  if (s) key = s.key; else { const x = {id:uid(), groupId:gid, date:TODAY, start:now, end:addMinutes(now, 120).slice(0, 5), note:"Séance ajoutée"}; DB.extras.push(x); key = "x" + x.id; }
  if (isTch() && !shiftOf(S.user.id, TODAY)) DB.shifts.push({id:uid(), u:S.user.id, date:TODAY, in:now, out:""});
  DB.live[key] = {by:S.user.id, start:now};
  S.modal = null; commit(`Cours démarré à ${now}`, `Cours démarré : ${g.name}`, "course"); render();
}

  <div class="grid g2">${DB.programs.map(p => { const n = DB.learners.filter(l => l.programId === p.id).length; return `

      <div style="margin-top:14px"><div class="small" style="font-weight:700;color:var(--muted);margin-bottom:6px">Prix par personne et par période, selon le nombre de personnes venues ensemble</div>
      <div class="f" style="gap:6px">${p.tiers.map((t, i) => `<div class="tier"><label class="fl" style="font-size:12px">De (pers.)<input type="number" min="1" data-tier="${i}" data-tf="min" value="${t.min}"></label><label class="fl" style="font-size:12px">À (99 = et +)<input type="number" min="1" data-tier="${i}" data-tf="max" value="${t.max}"></label><label class="fl" style="font-size:12px">Prix (F)<input type="number" min="0" step="500" data-tier="${i}" data-tf="price" value="${t.price}"></label><button class="btn sm ghost" data-a="delTier" data-p="${p.id}" data-i="${i}" aria-label="Supprimer ce palier">✕</button></div>`).join("")}</div>

    </div>`; }).join("")}</div>`;

/* ===== v5 : design inspired by the Stitch mock-ups ===== */
const ALERT_TAG = {relance:"Retard de paiement", expiration:"Fin de période", promesse:"Promesse non tenue", absence:"Absences répétées", test:"Test de placement", suivi:"À relancer"};
function urgentCard(a) {
  const l = a.l, acc = account(l), p = prog(l.programId);
  const amount = a.pay ? (a.key === "expiration" && acc.daysLeft < 0 ? acc.due : acc.balance || acc.due) : 0;
  return `<div class="ucard">
    <div class="uc-top"><div class="av nv">${initials(l.name)}</div><div class="uc-id"><b data-open="${l.id}">${esc(l.name)}</b><span>${esc(p?.name || "")}${l.parent ? " · parent : " + esc(l.parent) : ""}</span></div><span class="tag t-${a.lv}">${ALERT_TAG[a.key] || "À traiter"}</span></div>
    <div class="uc-box"><span>${esc(a.title.split(" — ").slice(1).join(" — ") || a.title)}<small>${esc(a.sub)}</small></span>${amount ? `<b class="num">${money(amount)}</b>` : ""}</div>
    <div class="uc-act"><button class="ub wa" data-a="wa" data-id="${l.id}" data-k="${a.key}">${ICON.wa}WhatsApp</button>
      ${a.pay ? `<button class="ub gd" data-a="newPayment" data-id="${l.id}">${ICON.money}Encaisser</button>` : a.advance ? `<button class="ub gd" data-a="advance" data-id="${l.id}">Étape suivante</button>` : ""}
      ${a.pay && ["inscrit","formation"].includes(l.stage) ? `<button class="ub lt" data-a="promise" data-id="${l.id}">${ICON.clock}Promesse</button>` : ""}
      <button class="ub tl" data-open="${l.id}">Fiche</button></div></div>`;
}
function staffUrgentCard(a) {
  return `<div class="ucard">
    <div class="uc-top">${avatar(a.u, 42)}<div class="uc-id"><b>${a.self ? "Vous" : esc(a.u.name)}</b><span>${ROLE_L[a.u.role]}</span></div><span class="tag t-${a.lv}">${a.self ? "Mes cours" : "Équipe"}</span></div>
    <div class="uc-box"><span>${esc(a.title)}<small>${esc(a.sub)}</small></span></div>
    <div class="uc-act">${a.self ? `<button class="ub gd" data-go="mycourses">Ouvrir Mes cours</button>` : `<a class="ub wa" target="_blank" rel="noopener" href="${waLink(a.u.phone, a.wa)}">${ICON.wa}Rappeler</a><button class="ub tl" data-a="actPerson" data-id="${a.u.id}">Son activité</button>`}</div></div>`;
}
function welcomeBanner(nUrg, nCourses) {
  const u = S.user, d = new Date();
  return `<div class="welcome"><div class="wl-id">${u.photo ? `<img src="${u.photo}" alt="">` : `<div class="wl-ini">${initials(u.name)}</div>`}
      <div><div class="wl-eye"><span>Valérie Language Academy</span> ${JOURS_L[d.getDay()]} ${fd(TODAY)}</div><h1>${isMgr() ? "Madame " : ""}${esc(u.name.split(" ")[0])}</h1><p>${isMgr() ? "Directrice · supervision pédagogique et financière" : ROLE_L[u.role]}</p></div></div>
    <div class="wl-chips"><div class="wl-chip ${nUrg ? "hot" : ""}"><small>Urgences</small><b>${nUrg ? `● ${nUrg} cas à régler` : "Tout est à jour"}</b></div><div class="wl-chip"><small>Aujourd'hui</small><b>${nCourses} cours prévu${nCourses > 1 ? "s" : ""}</b></div></div></div>`;
}
const kpi = (lab, val, sub, icon, go, extra = "") => `<button class="kpi" ${go ? `data-go="${go}"` : ""}><div class="kpi-h"><span>${lab}</span><i>${ICON[icon]}</i></div><div class="kpi-v num">${val}</div><div class="kpi-s">${sub}</div>${extra}</button>`;

function dashboard() {
  const al = buildAlerts(), sal = staffAlerts();
  const bal = cashBalance();
  const monthStart = THIS_MONTH + "-01";
  const mIn = validPays().filter(p => p.date >= monthStart).reduce((a, p) => a + p.amount, 0);
  const owed = DB.learners.reduce((a, l) => a + account(l).balance, 0);
  const pct = mIn + owed ? Math.round(mIn / (mIn + owed) * 100) : 100;
  const todayP = validPays().filter(p => p.date === TODAY), todayOut = DB.expenses.filter(e => e.date === TODAY && e.kind !== "apport");
  const staff = DB.team.filter(t => t.role !== "manager" && t.active && !t.deleted);
  const feed = DB.log.filter(x => x.u !== S.user.id).slice(0, 8);
  const events = dayEvents(TODAY), nCourses = sessionsOn(TODAY).filter(s => !s.cancelled).length;
  const leads = DB.learners.filter(l => ["prospect","test"].includes(l.stage)).length;
  return `
  ${welcomeBanner(al.length + sal.length, nCourses)}
  ${dayCard()}
  <div class="row qa"><button class="btn pri" data-a="newLearner">${ICON.plus}Nouvelle inscription</button><button class="btn gold" data-a="newPayment">${ICON.money}Encaisser</button><button class="btn" data-a="newOutflow">${ICON.out}Sortie d'argent</button><button class="btn" data-a="logCourse">✍️ Enregistrer un cours</button></div>
  <div class="grid g4 kpis">
    ${kpi("Recouvrement du mois", money(mIn), `Objectif ${money(mIn + owed)} · <b>${pct} %</b>`, "money", "payments", `<div class="bar gold"><i style="width:${pct}%"></i></div>`)}
    ${kpi("Solde de caisse", money(bal.total), `Aujourd'hui <b style="color:var(--ok)">+${money(todayP.reduce((a, p) => a + p.amount, 0))}</b> · <b style="color:var(--bad)">−${money(todayOut.reduce((a, e) => a + e.amount, 0))}</b>`, "out", "cash")}
    ${kpi("Reste à recouvrer", `<span style="color:var(--bad)">${money(owed)}</span>`, `${al.filter(a => a.pay).length} apprenants à relancer`, "receipt", "payments")}
    ${kpi("Apprenants actifs", DB.learners.filter(l => l.stage === "formation").length + " inscrits", `${leads} prospects et tests en cours`, "people", "learners")}
  </div>

  <div class="sect"><h2><span class="dot-red"></span>Urgences & actions immédiates</h2><span class="small muted">${al.length + sal.length} alerte${al.length + sal.length > 1 ? "s" : ""} · actions directes</span></div>
  <div class="ugrid">${sal.map(staffUrgentCard).join("")}${al.map(urgentCard).join("")}${!al.length && !sal.length ? `<div class="card empty">Aucune urgence. Tout est à jour.</div>` : ""}</div>

  <div class="sect"><h2>L'équipe en ce moment</h2><button class="btn sm" data-go="activity">Tout le suivi →</button></div>
  <div class="staffrow">${staff.map(t => { const st = staffStatus(t), la = lastAction(t); return `<button class="card staff" data-a="actPerson" data-id="${t.id}">${avatar(t, 48)}<div><b>${esc(t.name)}</b><div class="small muted">${ROLE_L[t.role]}</div><div class="st st-${st.lv}">${esc(st.t)}</div>${la ? `<div class="small muted">Dernière action ${la.at.slice(11)} : ${esc(la.t)}</div>` : ""}</div></button>`; }).join("")}</div>

  <div class="grid dash2">
    <div><div class="sect"><h2>Programme du jour</h2><button class="btn sm" data-go="planning">La semaine →</button></div>
      <div class="card">${events.length ? events.map(e => evRow(e)).join("") : `<div class="empty">Aucun cours ni rendez-vous aujourd'hui.</div>`}</div></div>
    <div><div class="sect"><h2>Ce que fait l'équipe</h2><button class="btn sm" data-go="activity">Journal →</button></div>
      <div class="card">${feed.length ? feed.map(feedRow).join("") : `<div class="empty">Aucune action pour l'instant.</div>`}</div></div>
  </div>`;
}
function secretaryDay() {
  const al = buildAlerts();
  const mine = DB.log.filter(x => x.u === S.user.id && x.at.startsWith(TODAY));
  const events = dayEvents(TODAY);
  return `
  ${welcomeBanner(al.length, sessionsOn(TODAY).filter(s => !s.cancelled).length)}
  ${shiftCard()}
  ${dayCard()}
  <div class="row qa"><button class="btn pri" data-a="newLearner">${ICON.plus}Nouvelle inscription</button><button class="btn gold" data-a="newPayment">${ICON.money}Encaisser</button><button class="btn" data-a="newOutflow">${ICON.out}Sortie d'argent</button><button class="btn" data-a="newAppt">${ICON.cal}Rendez-vous</button></div>
  <div class="sect"><h2><span class="dot-red"></span>À faire aujourd'hui</h2><span class="small muted">Relances, tests, inscriptions à finaliser</span></div>
  <div class="ugrid">${al.length ? al.map(urgentCard).join("") : `<div class="card empty">Rien en retard. Tout est à jour.</div>`}</div>
  <div class="grid dash2">
    <div><div class="sect"><h2>Programme du jour</h2></div><div class="card">${events.length ? events.map(e => evRow(e)).join("") : `<div class="empty">Aucun cours ni rendez-vous aujourd'hui.</div>`}</div></div>
    <div><div class="sect"><h2>Mes actions aujourd'hui</h2><span class="small muted">Visibles par la directrice</span></div><div class="card">${mine.length ? mine.map(feedRow).join("") : `<div class="empty">Rien pour l'instant.</div>`}</div></div>
  </div>`;
}

function learnerCard(l) {
  const a = account(l), p = prog(l.programId), g = group(l.groupId), at = attendance(l);
  const active = ["inscrit","formation"].includes(l.stage);
  const expired = l.stage === "formation" && a.daysLeft !== null && a.daysLeft < 0;
  let status = "";
  if (active) status = expired ? `<span class="tag t-bad">Période expirée</span>` : a.balance ? (a.daysLeft !== null && a.daysLeft <= DB.settings.alertDays ? `<span class="tag t-warn">Échéance ${fds(a.end)}</span>` : `<span class="tag t-warn">Reste ${money(a.balance)}</span>`) : `<span class="tag t-ok">Soldé 100 %</span>`;
  return `<div class="lcard">
    <div class="lc-av"><div class="av nv big">${initials(l.name)}</div>${l.level ? `<span class="lvl">Niveau ${esc(l.level)}</span>` : ""}</div>
    <div class="lc-main"><div class="row" style="gap:8px"><b class="lc-name" data-open="${l.id}">${esc(l.name)}</b>${pillStage(l.stage)}${status}</div>
      <div class="lc-sub">${esc(p?.name || "")}${l.groupSize > 1 ? ` · tarif groupe ×${l.groupSize}` : ""}</div>
      <div class="lc-meta"><span>📞 <span class="num">${esc(fmtTel(contactPhone(l)))}</span>${l.parent ? " · " + esc(l.parent) : ""}</span>${g ? `<span>🕒 ${esc(groupLabel(g))} · ${esc(g.room)}</span>` : ""}</div>
      ${at && at.total ? `<div class="lc-att"><span>Présence</span><div class="bar ${at.rate < 75 ? "bad" : ""}"><i style="width:${at.rate}%"></i></div><b class="num" style="color:${at.rate < 75 ? "var(--bad)" : "var(--ok)"}">${at.rate} % (${at.present}/${at.total})</b></div>` : ""}
    </div>
    <div class="lc-side">${active ? `<div class="lc-money"><div class="row" style="justify-content:space-between"><span class="lab">${esc(p?.name || "")}</span><span class="small" style="color:var(--ok)">Payé ${money(a.paid)}</span></div><div class="lc-due num">${money(a.due)}</div><div class="small" style="color:${a.balance || expired ? "var(--bad)" : "var(--muted)"};font-weight:700">${expired ? "À renouveler" : a.balance ? "Reste : " + money(a.balance) : "Reste à payer : 0 F"}</div></div>` : `<div class="lc-money"><span class="lab">Source</span><div style="font-weight:700">${esc(l.source)}</div><div class="small muted">Contact le ${fd(l.created)}</div></div>`}
      <div class="lc-act"><button class="ub wa" data-a="wa" data-id="${l.id}" data-k="${active ? (expired ? "expiration" : a.balance ? "relance" : "bienvenue") : l.stage === "test" ? "test" : "suivi"}">${ICON.wa}WhatsApp</button>${active && (a.balance || expired) ? `<button class="ub gd" data-a="newPayment" data-id="${l.id}">${ICON.money}Encaisser</button>` : l.stage === "termine" || l.stage === "formation" ? `<button class="ub lt" data-a="cert" data-id="${l.id}">${ICON.star}Attestation</button>` : `<button class="ub gd" data-a="advance" data-id="${l.id}">Étape suivante</button>`}<button class="ub nvb" data-open="${l.id}">Consulter</button></div></div>
  </div>`;
}

function demoBlock(demo, r, roles) { return `<div class="demo2"><div class="lab">⚡ Accès rapide démo${r ? " — " + roles.find(x => x[0] === r)[1] : ""}</div><div class="demo-acc">${demo.map(t => `<button data-login="${t.id}">${avatar(t, 30)}<span style="flex:1"><b>${esc(t.name)}</b></span><span class="muted small">${esc(t.pseudo)} / <span class="num">${esc(t.code)}</span></span></button>`).join("")}</div></div>`; }

      ${window.VLA_PUBLIC ? "" : demoBlock(demo, r, roles)}
      <div style="text-align:center;margin-top:18px"><p class="small muted" style="margin:0 0 8px">Code oublié ou compte bloqué ?</p><a class="btn wa sm" target="_blank" rel="noopener" href="${pubWa()}">${ICON.wa}Contacter Madame Valérie sur WhatsApp</a></div>
    </div></div></div>`;

function publicView() {
  const v = DB.site, st = DB.settings;
  const posts = v.posts.slice().sort((a, b) => b.date.localeCompare(a.date));
  const events = v.events.filter(e => e.date >= TODAY).sort((a, b) => a.date.localeCompare(b.date));
